# 大肥鱼的家园：一个侧边栏面板 + 本地生活模拟。
# 首次安装时由 bundle 插入；之后再改配置，请在自己 profile 的
# cordis.patch.yml 里用同 id 的条目覆盖（本文件只作为默认值）。
- insert:
    - id: fishhome
      name: dsh-fishhome
      config:
        characterName: 大肥鱼
        tickSeconds: 15
        # 房间/家具/事件的改动会写到这个目录（留空 = <DSH_HOME>/fishhome/data）。
        # 首次启动会把包内 data/ 复制过去，之后升级插件不会覆盖你的改动。
        dataDir: ''
        # 数据同步：auto = 插件更新后自动把新增/改过的出厂文件同步到你的数据目录（你改过的文件不动）
        # off = 只在数据目录为空时复制一次，之后完全不管
        dataSync: auto
